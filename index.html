<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinit's Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen background grid of 0s and 1s -->
  <div class="binary-bg" aria-hidden="true" id="binaryBg"></div>

  <!-- Main Content floating above the background -->
  <main class="content-card">
    <h1>Welcome</h1>
    <p>This is my personal webpage hosted on GitHub Pages.</p>
    <div class="badge">vinitk.github.io</div>
  </main>

  <script>
    // Fills the screen with light grey binary 1s and 0s
    function generateBinaryPattern() {
      const bg = document.getElementById('binaryBg');
      const charCount = Math.floor((window.innerWidth * window.innerHeight) / 120);
      let binaryStr = '';
      for (let i = 0; i < charCount; i++) {
        binaryStr += Math.random() > 0.5 ? '1 ' : '0 ';
      }
      bg.textContent = binaryStr;
    }

    generateBinaryPattern();
    window.addEventListener('resize', generateBinaryPattern);
  </script>
</body>
</html>
