<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinit's Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen true background canvas -->
  <canvas id="binaryCanvas"></canvas>

  <!-- Content floating directly over the binary backdrop -->
  <main class="content-wrapper">
    <h1>Welcome</h1>
    <p>This is my personal webpage hosted on GitHub Pages.</p>
    <div class="badge">vinitk.github.io</div>
  </main>

  <script>
    const canvas = document.getElementById('binaryCanvas');
    const ctx = canvas.getContext('2d');

    function drawBinaryBackground() {
      // Set canvas to high-DPI full resolution
      const dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);

      // Clean white background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // Dense 1 and 0 grid styling
      const fontSize = 13;
      const cellWidth = 14;   // Horizontal density
      const cellHeight = 16;  // Vertical density

      ctx.font = `600 ${fontSize}px "Courier New", Consolas, monospace`;
      ctx.fillStyle = '#6b7280'; // Solid, crisp darker grey

      const cols = Math.ceil(width / cellWidth);
      const rows = Math.ceil(height / cellHeight);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const char = Math.random() > 0.5 ? '1' : '0';
          ctx.fillText(char, c * cellWidth, r * cellHeight + fontSize);
        }
      }
    }

    drawBinaryBackground();
    window.addEventListener('resize', drawBinaryBackground);
  </script>
</body>
</html>
